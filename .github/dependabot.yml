version: 2
updates:
  # Keep GitHub Actions versions fresh (security + fixes).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - ci
    # Bundle all GitHub Actions bumps into ONE pull request per week instead of one
    # PR per action (which is what produced the three separate checkout/upload/download
    # PRs). Review + merge in a single click.
    groups:
      github-actions:
        patterns:
          - "*"
