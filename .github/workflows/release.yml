name: Release

# A release runs ONLY on a git tag like v1.2.3 (or v1.2.3-rc1).
# How to cut a release:
#   1. Create/edit UPDATE.md (version / title / prerelease / changelog).
#   2. git tag v1.2.3 && git push origin v1.2.3
# If UPDATE.md is ABSENT the run skips gracefully (green, no release) — nothing to
# publish. Adding UPDATE.md and pushing the tag again then releases normally.
# The workflow then:
#   - reads UPDATE.md and verifies its "version" matches the tag;
#   - builds binaries/installers for every platform (Linux/macOS/Windows, 64- and 32-bit);
#   - computes SHA256 checksums (SHA256SUMS.txt);
#   - publishes a GitHub Release with the title and body from UPDATE.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never cancel a release midway

permissions:
  contents: write                # required to create a GitHub Release

env:
  PROJECT: dji-link

jobs:
  # ---------------------------------------------------------------------------
  # Read UPDATE.md, validate the version against the tag, prepare release notes.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip:       ${{ steps.gate.outputs.skip }}
      version:    ${{ steps.parse.outputs.version }}
      title:      ${{ steps.parse.outputs.title }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      # No UPDATE.md at the repo root => nothing to release. Skip the whole run
      # gracefully (green, not failed): the downstream jobs are gated on this. When
      # UPDATE.md is later added, the next tag push releases normally.
      - name: Gate on UPDATE.md presence
        id: gate
        run: |
          set -euo pipefail
          if [ -f UPDATE.md ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "UPDATE.md present — proceeding with release."
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::UPDATE.md not found — skipping release (add it, then push the tag again)."
          fi

      - name: Parse UPDATE.md
        id: parse
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import os, re
          text = open('UPDATE.md', encoding='utf-8').read().replace('\r\n', '\n')
          m = re.match(r'^---\n(.*?)\n---\n?(.*)$', text, re.S)
          if not m:
              raise SystemExit('::error::UPDATE.md must start with a "---" YAML frontmatter block')
          fm, body = m.group(1), m.group(2).strip() + '\n'
          meta = {}
          for line in fm.split('\n'):
              if line.strip().startswith('#') or ':' not in line:
                  continue
              k, v = line.split(':', 1)
              meta[k.strip()] = v.strip().strip('"').strip("'")
          version = meta.get('version', '').strip()
          if not version:
              raise SystemExit('::error::"version:" missing in UPDATE.md frontmatter')
          title = meta.get('title', '').strip() or f'DJI Link v{version}'
          prerelease = meta.get('prerelease', 'false').strip().lower() in ('true', '1', 'yes')
          open('release-notes.md', 'w', encoding='utf-8').write(body)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
              f.write(f'title={title}\n')
              f.write(f'prerelease={"true" if prerelease else "false"}\n')
          print(f'Parsed UPDATE.md -> version={version!r} title={title!r} prerelease={prerelease}')
          PY

      - name: Verify tag matches UPDATE.md version
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="${{ steps.parse.outputs.version }}"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (=> $tag_version) does not match UPDATE.md version '$file_version'."
            echo "Fix UPDATE.md 'version:' or re-tag so they agree, then push again."
            exit 1
          fi
          echo "OK: tag $GITHUB_REF_NAME matches UPDATE.md version $file_version"

      - name: Upload release notes
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build + package for every platform / architecture.
  # ---------------------------------------------------------------------------
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    # Safety net: a hung step (e.g. a slow/stuck upload or hdiutil) fails within a bounded
    # time with logs, instead of running to the 6-hour default and blocking the release job.
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux: plain binary + distro packages (.deb + .rpm) ----
          - { slug: linux-x86_64,    os: ubuntu-22.04,     generators: 'TGZ;DEB;RPM' }
          - { slug: linux-arm64,     os: ubuntu-24.04-arm, generators: 'TGZ;DEB;RPM' }
          - { slug: linux-x86,       os: ubuntu-22.04,     generators: 'TGZ',
              cmake_extra: '-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32',
              experimental: true }
          # ---- macOS: per-arch DMGs, each bundling a matching ffmpeg binary ----
          - { slug: macos-arm64,      os: macos-14,         generators: 'TGZ;DragNDrop',
              osx_archs: 'arm64' }
          # macos-13 was the last Intel image and was RETIRED (Dec 2025). macos-15-intel
          # is GitHub's replacement x86_64 runner (native Intel, available until ~Aug 2027),
          # so brew still yields a matching x86_64 ffmpeg — no cross-compile needed.
          - { slug: macos-x86_64,     os: macos-15-intel,   generators: 'TGZ;DragNDrop',
              osx_archs: 'x86_64' }
          # ---- Windows: MSI installer (WiX) + portable .zip ----
          - { slug: windows-x64,     os: windows-latest,   generators: 'WIX;ZIP',
              msvc_arch: x64,   cpack_extra: '-D CPACK_WIX_ARCHITECTURE=x64' }
          # The native windows-11-arm runner has no WiX toolset (candle.exe), so an MSI
          # can't be built there. Instead cross-compile arm64 ON windows-latest (which HAS
          # WiX) via the MSVC amd64_arm64 toolchain — that yields a native arm64 app AND an
          # arm64 MSI. Nothing runs the cross-built binaries here (release only builds and
          # packages; the install check is file-existence only). CI still compile-checks
          # arm64 natively on windows-11-arm — see ci.yml.
          - { slug: windows-arm64,   os: windows-latest,   generators: 'WIX;ZIP',
              msvc_arch: amd64_arm64, cpack_extra: '-D CPACK_WIX_ARCHITECTURE=arm64', experimental: true }
          - { slug: windows-x86,     os: windows-latest,   generators: 'WIX;ZIP',
              msvc_arch: x86,   cpack_extra: '-D CPACK_WIX_ARCHITECTURE=x86', experimental: true }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install 32-bit toolchain (Linux x86)
        if: matrix.slug == 'linux-x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install RPM tooling (Linux)
        if: contains(matrix.generators, 'RPM')
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Chocolatey's ffmpeg package has NO 32-bit archive (`--x86` fails with
          # "32-bit archive is not supported for ffmpeg"), and no maintained 32-bit
          # Windows ffmpeg build exists anymore. ffmpeg runs as a SEPARATE process, so
          # the x64 build works fine when launched by the x86 (or arm64) app on any x64
          # Windows host — the realistic target. So always install the x64 package.
          choco install ffmpeg -y --no-progress
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { $ffmpeg = (Get-Command ffmpeg.exe).Source }
          New-Item -ItemType Directory -Force third_party/ffmpeg/bin | Out-Null
          Copy-Item (Join-Path (Split-Path $ffmpeg -Parent) "*") third_party/ffmpeg/bin -Recurse -Force
          $bundled = ((Resolve-Path third_party/ffmpeg/bin/ffmpeg.exe).Path).Replace('\', '/')
          $bundleDir = ((Resolve-Path third_party/ffmpeg/bin).Path).Replace('\', '/')
          "DJI_LINK_BUNDLED_FFMPEG=$bundled" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          "DJI_LINK_BUNDLED_FFMPEG_DIR=$bundleDir" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Bundled ffmpeg: $ffmpeg"

      - name: Bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ffmpeg
          mkdir -p third_party/ffmpeg/bin third_party/ffmpeg/lib
          cp "$(command -v ffmpeg)" third_party/ffmpeg/bin/ffmpeg
          chmod +x third_party/ffmpeg/bin/ffmpeg

          copy_deps() {
            local target="$1"
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r lib; do
              case "$lib" in
                /usr/lib/*|/System/*|@rpath/*|@loader_path/*|@executable_path/*) continue ;;
              esac
              local base
              base="$(basename "$lib")"
              if [ ! -f "third_party/ffmpeg/lib/$base" ]; then
                cp "$lib" "third_party/ffmpeg/lib/$base"
                chmod u+w "third_party/ffmpeg/lib/$base"
                copy_deps "third_party/ffmpeg/lib/$base"
              fi
            done
          }
          copy_deps third_party/ffmpeg/bin/ffmpeg

          patch_refs() {
            local target="$1"
            otool -L "$target" | tail -n +2 | awk '{print $1}' | while read -r lib; do
              case "$lib" in
                /usr/lib/*|/System/*) continue ;;
              esac
              local base
              base="$(basename "$lib")"
              install_name_tool -change "$lib" "@loader_path/../lib/$base" "$target" || true
            done
          }
          patch_refs third_party/ffmpeg/bin/ffmpeg
          for dylib in third_party/ffmpeg/lib/*.dylib; do
            [ -e "$dylib" ] || continue
            install_name_tool -id "@loader_path/../lib/$(basename "$dylib")" "$dylib" || true
            patch_refs "$dylib"
          done

          {
            echo "DJI_LINK_BUNDLED_FFMPEG=$PWD/third_party/ffmpeg/bin/ffmpeg"
            echo "DJI_LINK_BUNDLED_FFMPEG_LIB_DIR=$PWD/third_party/ffmpeg/lib"
          } >> "$GITHUB_ENV"
          echo "Bundled ffmpeg:"
          find third_party/ffmpeg -maxdepth 2 -type f | sort

      - name: Bundle ffmpeg (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # x86_64 / arm64 pull a static build from BtbN/FFmpeg-Builds (GitHub Releases).
          # We used to use johnvansickle.com, but that server returns HTTP 415 to GitHub
          # Actions / datacenter IPs, which broke the (required) linux-x86_64 job. GitHub's
          # own CDN never blocks its runners. BtbN has no 32-bit build, so linux-x86 keeps
          # johnvansickle's i686 static tarball (that job is best-effort / continue-on-error).
          btbn="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          # 32-bit: no maintained static build is served from a host that allows datacenter
          # IPs (johnvansickle answers 415 to Actions runners), so several candidates are
          # tried and bundling is SKIPPED if none work — see the loop below.
          case "${{ matrix.slug }}" in
            linux-x86_64) urls=("$btbn/ffmpeg-master-latest-linux64-gpl.tar.xz") ;;
            linux-arm64)  urls=("$btbn/ffmpeg-master-latest-linuxarm64-gpl.tar.xz") ;;
            # eugeneware/ffmpeg-static publishes a BARE static i386 binary (not a tarball)
            # on GitHub Releases, so it is never blocked for runners. johnvansickle stays
            # as a last resort, but it answers 415 to datacenter IPs in general.
            linux-x86)    urls=(
                            "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-ia32"
                            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-i686-static.tar.xz"
                          ) ;;
            *) echo "::error::unknown Linux ffmpeg arch for ${{ matrix.slug }}"; exit 1 ;;
          esac
          mkdir -p third_party/ffmpeg/bin /tmp/ffx
          got=""
          for url in "${urls[@]}"; do
            echo "Trying $url"
            if curl -fL --retry 3 --retry-all-errors --connect-timeout 20 "$url" -o /tmp/ffmpeg.dl; then
              got="$url"; break
            fi
            echo "::warning::download failed: $url"
          done
          # Bundling ffmpeg is optional (CMake only installs it when the file exists), and
          # ffmpeg is a separate process the user can supply themselves. A dead mirror must
          # not fail the whole build, so give up quietly and build without it.
          if [ -z "$got" ]; then
            echo "::warning::no ffmpeg build could be downloaded for ${{ matrix.slug }} — packaging WITHOUT bundled ffmpeg"
            exit 0
          fi
          # A source serves either a tarball or a bare executable; detect which by content
          # rather than by file extension.
          if file -b /tmp/ffmpeg.dl | grep -qi 'XZ compressed'; then
            tar -xJf /tmp/ffmpeg.dl -C /tmp/ffx
            # Layout differs per source (BtbN: <dir>/bin/ffmpeg; johnvansickle: <dir>/ffmpeg),
            # so locate the binary instead of hard-coding the path.
            ff="$(find /tmp/ffx -type f -name ffmpeg | head -1)"
          else
            ff=/tmp/ffmpeg.dl
          fi
          if [ -z "$ff" ] || [ ! -s "$ff" ]; then
            echo "::warning::ffmpeg binary not found inside $got — packaging WITHOUT bundled ffmpeg"
            exit 0
          fi
          cp "$ff" third_party/ffmpeg/bin/ffmpeg
          chmod +x third_party/ffmpeg/bin/ffmpeg
          # A 32-bit binary will not execute on a runner without 32-bit libs, so a failed
          # -version check is informational only, not a build error.
          third_party/ffmpeg/bin/ffmpeg -version || echo "::warning::bundled ffmpeg is not runnable on this runner (expected when cross-arch)"
          echo "DJI_LINK_BUNDLED_FFMPEG=$PWD/third_party/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_args=()
          if [ -n "${DJI_LINK_BUNDLED_FFMPEG:-}" ]; then
            ffmpeg_args+=("-DDJI_LINK_BUNDLED_FFMPEG=${DJI_LINK_BUNDLED_FFMPEG}")
          fi
          if [ -n "${DJI_LINK_BUNDLED_FFMPEG_DIR:-}" ]; then
            ffmpeg_args+=("-DDJI_LINK_BUNDLED_FFMPEG_DIR=${DJI_LINK_BUNDLED_FFMPEG_DIR}")
          fi
          if [ -n "${DJI_LINK_BUNDLED_FFMPEG_LIB_DIR:-}" ]; then
            ffmpeg_args+=("-DDJI_LINK_BUNDLED_FFMPEG_LIB_DIR=${DJI_LINK_BUNDLED_FFMPEG_LIB_DIR}")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDJI_LINK_VERSION="${{ needs.prepare.outputs.version }}" \
            ${{ matrix.osx_archs && format('-DCMAKE_OSX_ARCHITECTURES="{0}" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0', matrix.osx_archs) || '' }} \
            ${{ matrix.cmake_extra || '' }} \
            "${ffmpeg_args[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          base="${PROJECT}-${version}-${{ matrix.slug }}"
          mkdir -p dist

          if [ -f build/CPackConfig.cmake ]; then
            # Standard path: the project's CMake does include(CPack).
            cpack --config build/CPackConfig.cmake \
              -G "${{ matrix.generators }}" \
              -B "$PWD/dist" \
              -D CPACK_PACKAGE_VERSION="$version" \
              -D CPACK_PACKAGE_FILE_NAME="$base" \
              ${{ matrix.cpack_extra || '' }}
          else
            # Fallback while CMake has no include(CPack): install and archive.
            # Installers (NSIS/DMG/DEB) appear once you add CPack — see docs/CI_CD.md.
            echo "::warning::build/CPackConfig.cmake not found — falling back to cmake --install + archive."
            cmake --install build --config Release --prefix "stage/$base"
            if [ "$RUNNER_OS" = "Windows" ]; then
              (cd stage && 7z a -tzip "$OLDPWD/dist/$base.zip" "$base" >/dev/null)
            else
              tar -czf "dist/$base.tar.gz" -C stage "$base"
            fi
          fi

          echo "Packaged artifacts:"
          ls -la dist

      - name: Create stable latest-download aliases
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          base="${PROJECT}-${version}-${{ matrix.slug }}"
          shopt -s nullglob
          for path in dist/"$base".*; do
            name="$(basename "$path")"
            ext="${name#${base}.}"
            alias="dist/${PROJECT}-${{ matrix.slug }}.${ext}"
            cp "$path" "$alias"
            echo "alias: $(basename "$path") -> $(basename "$alias")"
          done
          echo "Release artifacts including stable aliases:"
          ls -la dist

      - name: Verify install tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-install
          cmake --install build --config Release --prefix "$PWD/verify-install"
          case "$RUNNER_OS" in
            Windows)
              test -f verify-install/bin/dji-link.exe
              test -f verify-install/bin/ffmpeg.exe
              ;;
            macOS)
              test -x verify-install/dji-link.app/Contents/MacOS/dji-link
              test -x verify-install/dji-link.app/Contents/Resources/bin/ffmpeg
              verify-install/dji-link.app/Contents/Resources/bin/ffmpeg -version >/dev/null
              otool -L verify-install/dji-link.app/Contents/Resources/bin/ffmpeg
              ;;
            Linux)
              test -x verify-install/bin/dji-link
              test -x verify-install/bin/ffmpeg
              verify-install/bin/ffmpeg -version >/dev/null
              ;;
          esac

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.slug }}
          # Upload ONLY the finished packages — never `dist/*`. `cpack -B dist` also drops a
          # `dist/_CPack_Packages/` staging tree there, and on macOS the DragNDrop generator
          # puts an `/Applications` symlink inside it. `dist/*` would make upload-artifact's
          # globber follow that symlink into the runner's /Applications (Xcode, gigabytes),
          # hanging the step with no output right after "Run actions/upload-artifact". These
          # top-level extension globs skip the staging dir entirely (and shrink the upload).
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.msi
          if-no-files-found: error
          retention-days: 7
          # dist/ already holds compressed packages; re-zipping them (upload-artifact's
          # default level 6) is wasted CPU — store instead of recompressing.
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Raspberry Pi installer: a self-contained `curl | bash` script + the pi/ bundle
  # it downloads. Lets a bare Pi be prepared as the AOA jump-host in one command,
  # and installs a systemd service that auto-starts the bridge on every power-up.
  # ---------------------------------------------------------------------------
  pi-installer:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Package the pi/ bundle
        run: |
          set -euo pipefail
          bash tests/ap_channel_test.sh
          python3 tests/netctl_sim_test.py
          mkdir -p dist stage/pi
          # Everything the Pi needs at runtime (transparent AOA<->TCP bridge + setup).
          cp dji_link_beta/pi/*.py dji_link_beta/pi/*.sh stage/pi/
          cp dji_link_beta/pi/README.md stage/pi/ 2>/dev/null || true
          # One file per invocation: `bash -n a.sh b.sh` parses only a.sh and turns the
          # rest into positional parameters, so the glob silently checked ap.sh alone and
          # nothing else in the bundle was ever syntax-checked.
          for f in stage/pi/*.sh; do bash -n "$f"; done
          python3 -m py_compile stage/pi/*.py
          tar -czf dist/dji-link-pi.tar.gz -C stage pi
          echo "Bundle contents:"
          tar -tzf dist/dji-link-pi.tar.gz

      - name: Stamp the installer script (repo / tag / asset)
        run: |
          set -euo pipefail
          sed -e "s|@@REPO@@|${GITHUB_REPOSITORY}|g" \
              -e "s|@@TAG@@|${GITHUB_REF_NAME}|g" \
              -e "s|@@ASSET@@|dji-link-pi.tar.gz|g" \
              dji_link_beta/pi/install.sh > dist/install-pi.sh
          chmod +x dist/install-pi.sh
          bash -n dist/install-pi.sh
          echo "----- stamped install-pi.sh header -----"
          head -n 20 dist/install-pi.sh

      - name: Upload Pi installer
        uses: actions/upload-artifact@v7
        with:
          name: packages-pi-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gather everything: checksums + publish the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, build, pi-installer]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes

      - name: Verify stable latest-download aliases
        working-directory: dist
        run: |
          set -euo pipefail
          required=(
            dji-link-linux-x86_64.tar.gz
            dji-link-linux-x86_64.deb
            dji-link-linux-x86_64.rpm
            dji-link-linux-arm64.tar.gz
            dji-link-linux-arm64.deb
            dji-link-linux-arm64.rpm
            dji-link-macos-arm64.dmg
            dji-link-macos-arm64.tar.gz
            dji-link-macos-x86_64.dmg
            dji-link-macos-x86_64.tar.gz
            dji-link-windows-x64.msi
            dji-link-windows-x64.zip
            install-pi.sh
            dji-link-pi.tar.gz
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "::error::missing stable latest asset: $f"; exit 1; }
          done

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # This job has no checkout (no .git), so gh can't infer the repo from a git
          # remote — pass it explicitly with --repo, otherwise `gh release create` fails
          # with "fatal: not a git repository". The tag already exists on the remote (it
          # triggered this workflow), so gh just creates the release against it.
          args=(--repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file notes/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
