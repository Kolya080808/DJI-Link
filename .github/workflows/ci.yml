name: CI

# Compile-check + tests, so broken code never reaches a release.
# IMPORTANT: runs ONLY when C++ / CMake code changed (path filter below), and only
# on push to main / in PRs. Changes to dji_link_beta/ (Python), *.md or docs do NOT
# trigger a build, and feature branches without a PR don't run CI either — iterate freely.
#
# Releases (building binaries/installers + checksums + publishing) live separately in
# release.yml and run ONLY on a git tag vX.Y.Z. See docs/CI_CD.md.
on:
  push:
    branches: [main]
    paths: &cpp_paths
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '**/*.inl'
      - '**/*.ipp'
      - '**/*.tpp'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'cmake/**'
      - 'CMakePresets.json'
      - 'CMakeUserPresets.json'
      - 'vcpkg.json'
      - 'conanfile.txt'
      - 'conanfile.py'
      - '.github/workflows/ci.yml'   # re-run if the workflow itself changed
  pull_request:
    paths: *cpp_paths
  workflow_dispatch:                 # manual run from the Actions tab

# A new push to the same branch/PR cancels the previous in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Best-effort targets (32-bit + Windows-arm64) must not fail the whole CI run —
    # same policy as release.yml's `experimental` jobs. Everything else is required.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      # This matrix mirrors release.yml's build matrix (same runners / arches), so CI
      # compile-checks EVERY platform a release ships — nothing gets built for the first
      # time only during a tagged release. CI stops at build + test; packaging, ffmpeg
      # bundling and installers stay in release.yml. Keep the two matrices in sync.
      # One deliberate exception: windows-arm64. CI builds it NATIVELY on windows-11-arm
      # (best compile-check, and native tests can run there later). release instead
      # cross-builds arm64 on windows-latest because only that runner has WiX for the MSI.
      # Same arm64 MSVC target either way, so a compile error still surfaces in CI.
      matrix:
        include:
          # ---- Linux ----
          - { name: linux-x86_64-gcc,   os: ubuntu-22.04,     cc: gcc,   cxx: g++ }
          # Extra compiler coverage on the primary Linux target (release uses gcc only).
          - { name: linux-x86_64-clang, os: ubuntu-22.04,     cc: clang, cxx: clang++ }
          - { name: linux-arm64,        os: ubuntu-24.04-arm, cc: gcc,   cxx: g++ }
          - { name: linux-x86,          os: ubuntu-22.04, multilib: true, experimental: true,
              cmake_extra: '-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32' }
          # ---- macOS (per-arch, matching release's separate DMG runners) ----
          - { name: macos-arm64,        os: macos-14,       osx_archs: arm64 }
          # macos-13 (last Intel image) was retired Dec 2025 — macos-15-intel is the
          # replacement x86_64 runner (see release.yml / docs/CI_CD.md).
          - { name: macos-x86_64,       os: macos-15-intel, osx_archs: x86_64 }
          # ---- Windows (MSVC, per-arch) ----
          - { name: windows-x64,        os: windows-latest, msvc_arch: x64 }
          - { name: windows-arm64,      os: windows-11-arm, msvc_arch: arm64, experimental: true }
          - { name: windows-x86,        os: windows-latest, msvc_arch: x86,   experimental: true }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # CMake + Ninja (cross-platform, recent versions).
      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      # On Windows, set up the MSVC (cl.exe) environment for the Ninja generator,
      # cross-targeting the matrix arch (x64 / arm64 / x86) exactly like release.yml.
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # 32-bit Linux needs the multilib compilers to honour -m32 (matches release.yml).
      - name: Install 32-bit toolchain (Linux x86)
        if: matrix.multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      # Compiler cache: ccache on Linux/macOS, sccache on Windows.
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.name }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          launcher=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cc  && format('-DCMAKE_C_COMPILER={0}',   matrix.cc)  || '' }} \
            ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }} \
            ${{ matrix.osx_archs && format('-DCMAKE_OSX_ARCHITECTURES="{0}" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0', matrix.osx_archs) || '' }} \
            ${{ matrix.cmake_extra || '' }} \
            -DCMAKE_C_COMPILER_LAUNCHER=$launcher \
            -DCMAKE_CXX_COMPILER_LAUNCHER=$launcher

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        # --no-tests=ignore: while there are no tests yet, "no tests" counts as success,
        # but real test failures still fail CI.
        run: ctest --test-dir build --build-config Release --output-on-failure --no-tests=ignore
