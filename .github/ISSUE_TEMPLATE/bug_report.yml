name: Bug report
description: Report a reproducible problem in DJI Link
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove passwords, serial numbers, private IPs, and unredacted flight logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or 1a2b3c4
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 x64, Mavic Mini 1, RC, Pi Zero 2 W
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the shortest sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact secrets and private identifiers before attaching files.
