name: 2. Question or help
description: Ask for help when the Wiki does not answer your question
title: "question: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out — we are always happy to help. Please check the [Wiki](https://github.com/Kolya080808/DJI-Link/wiki) first. If it does not answer your question, describe what you are trying to do below.
  - type: input
    id: goal
    attributes:
      label: What are you trying to do?
      placeholder: Connect the Pi bridge, run the simulator, build from source...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11 x64, Mavic Mini 1, RC, Pi Zero 2 W
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Link the Wiki page or documentation you followed and explain where you got stuck.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add redacted logs or screenshots if they help explain the question.
